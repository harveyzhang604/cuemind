<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">CueMind synthetic interface illustration</title><desc id="desc">Bilingual synthetic subtitles with compact replay controls and local data explanation.</desc><rect width="800" height="440" rx="24" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243b32"><text x="34" y="48" font-size="24" font-weight="700">CueMind · 视频精读与复听</text><text x="34" y="76" font-size="13" fill="#627267">合成示例 · 无账号、密钥或私人内容</text><text x="34" y="122" font-size="17">字幕</text><text x="220" y="122" font-size="17">问答</text><text x="405" y="122" font-size="17">概览</text><text x="600" y="122" font-size="17">笔记</text><path d="M34 140H766" stroke="#d8dfd4"/><path d="M34 140H180" stroke="#2d5946" stroke-width="3"/><text x="34" y="176" font-size="15">双语⌄　　重点：托福⌄</text><text x="576" y="176" font-size="15">复制　导出　读取</text><rect x="24" y="195" width="752" height="110" rx="12" fill="#e5edde"/><text x="44" y="229" font-size="14" fill="#627267">00:12</text><text x="126" y="232" font-size="21">Small steps make learning easier.</text><text x="126" y="270" font-size="18" fill="#627267">小步前进，让学习更容易。</text><text x="44" y="340" font-size="14" fill="#627267">00:17</text><text x="126" y="342" font-size="21">Keep your notes and come back tomorrow.</text><path d="M24 372H776" stroke="#d8dfd4"/><text x="38" y="410" font-size="17">◀</text><rect x="65" y="384" width="132" height="44" rx="9" fill="#2d5946"/><text x="82" y="411" font-size="17" fill="#fff">↺ 复听 1 句</text><text x="210" y="410" font-size="17">▶</text><text x="550" y="410" font-size="13" fill="#627267">已暂停 · 空格播放</text><text x="704" y="410" font-size="15">听 1 次</text></g></svg>
